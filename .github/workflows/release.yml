name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # Full end-to-end run (real Nomad + steamcmd) on the tagged commit. The
  # release job below needs it, so a failing e2e blocks publishing.
  e2e:
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Resolve modules
        # `go mod tidy` occasionally hits a transient network error talking
        # to sum.golang.org (Go's checksum database) -- an HTTP/2 stream
        # error unrelated to anything in this repo. A short retry clears
        # it without needing a manual workflow re-run every time it happens.
        run: |
          for i in 1 2 3; do
            if go mod tidy; then
              exit 0
            fi
            echo "go mod tidy failed (attempt $i/3), retrying in 10s..."
            sleep 10
          done
          echo "::error::go mod tidy failed after 3 attempts"
          exit 1

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          go build \
            -ldflags "-X github.com/byteford/nomad-driver-steamcmd/driver.pluginVersion=${version}" \
            -o dist/nomad-driver-steamcmd \
            ./cmd/nomad-driver-steamcmd

      - name: Package
        run: |
          cd dist
          pkg="nomad-driver-steamcmd_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir "$pkg"
          mv nomad-driver-steamcmd "$pkg/"
          tar -czf "${pkg}.tar.gz" "$pkg"
          sha256sum "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomad-driver-steamcmd_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 7

  release:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
