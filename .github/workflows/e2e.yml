name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml so a tag cannot publish unless this passes.
  workflow_call:

permissions:
  contents: read

env:
  NOMAD_VERSION: "1.10.0"
  # Half-Life Dedicated Server: small (~100-200MB), anonymous-downloadable,
  # well-known stable choice for steamcmd smoke tests. Swap via workflow
  # dispatch input if you want to test against a different app.
  TEST_APP_ID: "90"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Resolve modules
        # `go mod tidy` occasionally hits a transient network error talking
        # to sum.golang.org (Go's checksum database) -- an HTTP/2 stream
        # error unrelated to anything in this repo. A short retry clears
        # it without needing a manual workflow re-run every time it happens.
        run: |
          for i in 1 2 3; do
            if go mod tidy; then
              exit 0
            fi
            echo "go mod tidy failed (attempt $i/3), retrying in 10s..."
            sleep 10
          done
          echo "::error::go mod tidy failed after 3 attempts"
          exit 1

      - name: Build driver plugin
        run: |
          mkdir -p dist/plugins
          go build -o dist/plugins/nomad-driver-steamcmd ./cmd/nomad-driver-steamcmd

      - name: Install Nomad
        run: |
          curl -fsSL -o nomad.zip \
            "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip"
          unzip nomad.zip
          sudo mv nomad /usr/local/bin/nomad
          nomad version

      - name: Install steamcmd
        run: |
          sudo dpkg --add-architecture i386
          echo steam steam/question select "I AGREE" | sudo debconf-set-selections
          echo steam steam/license note "" | sudo debconf-set-selections
          sudo add-apt-repository -y multiverse
          sudo apt-get update -y
          sudo apt-get install -y steamcmd lib32gcc-s1
          sudo ln -sf /usr/games/steamcmd /usr/local/bin/steamcmd
          steamcmd +quit || true # first run self-updates and may "fail" harmlessly

      - name: Write Nomad agent config
        run: |
          mkdir -p /tmp/nomad-data
          cat > /tmp/nomad-agent.hcl <<'EOF'
          data_dir  = "/tmp/nomad-data"
          bind_addr = "127.0.0.1"

          # Required outside -dev mode: unlike dev mode, which picks safe
          # advertise defaults automatically, a real server/client config
          # refuses to silently default advertise addresses to localhost
          # ("Defaulting advertise to localhost is unsafe") and requires
          # them set explicitly, even for an intentionally local single
          # node like this one.
          advertise {
            http = "127.0.0.1"
            rpc  = "127.0.0.1"
            serf = "127.0.0.1"
          }

          # Explicit server+client config with real raft persistence,
          # instead of `nomad agent -dev`. Dev mode always boots a fresh,
          # in-memory single-node cluster with no persisted server state --
          # convenient for most of this suite, but it silently defeats the
          # restart-recovery test later on: after a restart under -dev, the
          # server has no memory the job ever existed at all, so
          # RecoverTask never even gets a chance to run. This config
          # behaves like -dev for a single node otherwise, but actually
          # persists across a real agent restart.
          server {
            enabled          = true
            bootstrap_expect = 1
          }

          client {
            enabled = true
          }

          plugin_dir = "${GITHUB_WORKSPACE}/dist/plugins"

          # The plugin block's label must match the plugin BINARY's
          # filename in plugin_dir ("nomad-driver-steamcmd"), NOT the
          # driver's self-reported PluginInfo.Name ("steamcmd") -- these
          # are two different things. Nomad docs: "The name of the plugin
          # is the plugin's executable name relative to plugin_dir." A
          # driver's *internal* registered name (used in `driver =
          # "steamcmd"` in job specs, and in `Drivers.steamcmd.Healthy`
          # health checks below) only gets set once Nomad actually spawns
          # the binary and queries it over RPC -- which never happens if
          # this label doesn't match the filename first. Confirmed the
          # hard way: with a mismatched label, the driver was completely
          # absent from Nomad's own "detected plugin" log list, not
          # loaded-with-wrong-config as previously assumed.
          plugin "nomad-driver-steamcmd" {
            config {
              steamcmd_path = "steamcmd"

              # These two intentionally differ from their own schema
              # defaults (steamcmd_path and default_login_anonymous above
              # do NOT -- that's exactly the blind spot that let the
              # agent-config forwarding bug hide for so long: you can't
              # tell "explicit value honored" from "silently fell back to
              # a default that happens to match" unless they differ).
              # default_login_username has no functional effect here
              # (default_login_anonymous=true means it's never used to
              # actually log in), and max_concurrent_installs=2 just
              # limits install concurrency -- both safe to set to
              # non-default values purely to prove forwarding works.
              # See "Assert plugin-level agent config values are actually
              # forwarded" below.
              default_login_anonymous = true
              default_login_username  = "e2e-config-canary"
              max_concurrent_installs = 2
            }
          }
          EOF
          # Expand GITHUB_WORKSPACE into the HCL file since HCL doesn't do
          # shell-style env expansion itself.
          sed -i "s|\${GITHUB_WORKSPACE}|${GITHUB_WORKSPACE}|" /tmp/nomad-agent.hcl
          cat /tmp/nomad-agent.hcl

      - name: Start Nomad agent
        run: |
          sudo -E nohup nomad agent \
            -config=/tmp/nomad-agent.hcl \
            > /tmp/nomad.log 2>&1 &

          up=false
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:4646/v1/status/leader >/dev/null; then
              echo "nomad is up"
              up=true
              break
            fi
            sleep 1
          done

          if [ "$up" != "true" ]; then
            echo "::error::nomad agent never became healthy within the timeout"
            echo "--- process status ---"
            ps aux | grep -i nomad || true
            echo "--- /tmp/nomad.log ---"
            cat /tmp/nomad.log || true
            exit 1
          fi

          curl -sf http://127.0.0.1:4646/v1/status/leader

      - name: Confirm driver fingerprinted healthy
        run: |
          for i in $(seq 1 30); do
            status=$(curl -s http://127.0.0.1:4646/v1/nodes | jq -r '.[0].Drivers.steamcmd.Healthy')
            echo "driver health: $status"
            if [ "$status" = "true" ]; then
              break
            fi
            sleep 2
          done
          if [ "$status" != "true" ]; then
            echo "::error::steamcmd driver never reported healthy"
            cat /tmp/nomad.log
            exit 1
          fi

          # A healthy driver does not mean the node is schedulable yet: a job
          # submitted while the node is still "initializing" fails with "No
          # nodes were eligible for evaluation" (seen on a CI run).
          for i in $(seq 1 30); do
            node=$(curl -s http://127.0.0.1:4646/v1/nodes | jq -r '.[0] | "\(.Status)/\(.SchedulingEligibility)"')
            echo "node: $node"
            if [ "$node" = "ready/eligible" ]; then
              break
            fi
            sleep 2
          done
          if [ "$node" != "ready/eligible" ]; then
            echo "::error::node never became ready and eligible (last: $node)"
            cat /tmp/nomad.log
            exit 1
          fi

          echo "--- steamcmd plugin config as loaded by SetConfig ---"
          grep "steamcmd plugin config loaded" /tmp/nomad.log || echo "::warning::no SetConfig log line found -- driver may not have logged it as expected"

      - name: Assert plugin-level agent config values are actually forwarded (regression test)
        run: |
          # This is the actual regression test for the agent-config
          # forwarding bug this driver spent a long time chasing. It's
          # NOT sufficient to check steamcmd_path or default_login_anonymous
          # here -- both are set to their own schema defaults in this
          # workflow's agent config, so they'd report success identically
          # whether forwarding is genuinely fixed or still silently
          # falling back to defaults. default_login_username and
          # max_concurrent_installs are set to values that differ from
          # their defaults specifically so this test can tell the
          # difference.
          config_line=$(grep "steamcmd plugin config loaded" /tmp/nomad.log | tail -1)
          if [ -z "$config_line" ]; then
            echo "::error::no 'steamcmd plugin config loaded' log line found -- cannot verify config forwarding"
            exit 1
          fi

          if ! echo "$config_line" | grep -q 'e2e-config-canary'; then
            echo "::error::default_login_username did not forward correctly -- agent-config values are being silently dropped/defaulted (see PluginConfig doc comment in driver/config.go)"
            echo "$config_line"
            exit 1
          fi

          if ! echo "$config_line" | grep -q 'max_concurrent_installs=2'; then
            echo "::error::max_concurrent_installs did not forward correctly -- agent-config values are being silently dropped/defaulted (see PluginConfig doc comment in driver/config.go)"
            echo "$config_line"
            exit 1
          fi

          echo "confirmed: agent-level plugin config values that differ from their schema defaults ARE reaching SetConfig correctly on this Nomad version"

      - name: Render install-only test job
        run: |
          cat > /tmp/install-test.nomad.hcl <<EOF
          job "steamcmd-e2e-install" {
            datacenters = ["dc1"]
            type        = "batch"

            group "install" {
              task "hlds" {
                driver = "steamcmd"

                config {
                  app_id      = "${TEST_APP_ID}"
                  install_dir = "local/steamapp"
                  validate    = true
                }

                resources {
                  cpu    = 500
                  memory = 512
                }
              }
            }
          }
          EOF

      - name: Run install job and wait for completion
        run: |
          nomad job run /tmp/install-test.nomad.hcl
          job_id="steamcmd-e2e-install"

          for i in $(seq 1 60); do
            status=$(nomad job status -short "$job_id" 2>/dev/null | awk '/^Status/ {print $NF}')
            echo "job status: $status"
            if [ "$status" = "dead" ]; then
              break
            fi
            sleep 5
          done

          nomad job status "$job_id"
          alloc_id=$(nomad job allocs -json "$job_id" | jq -r '.[0].ID')
          if [ -z "$alloc_id" ] || [ "$alloc_id" = "null" ]; then
            echo "::error::could not determine an allocation ID for job $job_id"
            nomad job status "$job_id"
            exit 1
          fi
          echo "alloc_id=$alloc_id" >> "$GITHUB_ENV"

          nomad alloc status "$alloc_id"

      - name: Assert task exited successfully
        run: |
          # task_state=="dead" alone proves nothing -- a failed task is
          # also "dead". Check the actual Events array for a Driver
          # Failure entry directly, rather than grepping task logs (which
          # can be empty/404 if the task never started at all, silently
          # passing a log-grep check that has nothing to match against).
          driver_failure=$(nomad alloc status -json "$alloc_id" | jq -r '[.TaskStates.hlds.Events[]? | select(.Type == "Driver Failure")][0].DisplayMessage // empty')
          if [ -n "$driver_failure" ]; then
            echo "::error::task hit a Driver Failure event: $driver_failure"
            nomad alloc status -verbose "$alloc_id" || true
            exit 1
          fi

          exit_code=$(nomad alloc status -json "$alloc_id" | jq -r '[.TaskStates.hlds.Events[]? | select(.Details.exit_code != null)][0].Details.exit_code // empty')
          echo "reported exit_code: ${exit_code:-none}"
          if [ "$exit_code" != "0" ]; then
            echo "::error::task did not exit 0 (got: ${exit_code:-none})"
            nomad alloc status -verbose "$alloc_id" || true
            exit 1
          fi

          task_state=$(nomad alloc status -json "$alloc_id" | jq -r '.TaskStates.hlds.State')
          echo "task state: $task_state"
          if [ "$task_state" != "dead" ]; then
            echo "::error::task did not reach dead state"
            exit 1
          fi

          # Belt-and-suspenders: also scan actual task output for markers,
          # now that we know the task genuinely ran (exit_code check above
          # already passed) rather than relying on this log-grep alone.
          nomad alloc logs "$alloc_id" hlds | tee /tmp/task.log || true
          if grep -qiE "ERROR!|authentication failed|insufficient disk space|no login specified" /tmp/task.log; then
            echo "::error::task log contains a failure marker"
            exit 1
          fi

      - name: Assert install actually landed on disk
        run: |
          find /tmp/nomad-data/alloc/"$alloc_id" -maxdepth 6 -iname "*steamapp*" -o -iname "*.acf" | tee /tmp/found_files.txt
          if [ ! -s /tmp/found_files.txt ]; then
            echo "::error::no installed steamapp files found under the alloc dir"
            exit 1
          fi

      - name: Render deliberate auth-failure job (negative test)
        run: |
          cat > /tmp/authfail-test.nomad.hcl <<EOF
          job "steamcmd-e2e-authfail" {
            datacenters = ["dc1"]
            type        = "batch"

            group "install" {
              task "badauth" {
                driver = "steamcmd"

                config {
                  app_id      = "${TEST_APP_ID}"
                  install_dir = "local/steamapp"

                  login_anonymous = false
                  login_username  = "definitely-not-a-real-account"
                  login_password  = "definitely-wrong"
                }

                resources {
                  cpu    = 500
                  memory = 512
                }
              }
            }
          }
          EOF
          nomad job run /tmp/authfail-test.nomad.hcl

      - name: Assert auth-failure job fails with a real auth rejection (not a hang, and not our own bug)
        run: |
          job_id="steamcmd-e2e-authfail"
          for i in $(seq 1 30); do
            status=$(nomad job status -short "$job_id" 2>/dev/null | awk '/^Status/ {print $NF}')
            echo "authfail job status: $status"
            if [ "$status" = "dead" ]; then
              break
            fi
            sleep 5
          done
          nomad job status "$job_id"

          authfail_alloc_id=$(nomad job allocs -json "$job_id" | jq -r '.[0].ID // empty')
          if [ -z "$authfail_alloc_id" ]; then
            echo "::error::could not determine an allocation ID for job $job_id"
            exit 1
          fi

          # A generic "failed" in the job summary isn't enough -- that
          # would be equally true whether steamcmd genuinely rejected the
          # bad credentials (what this test wants) or the driver never
          # even passed a login through at all (a real bug that slipped
          # past this exact check before). Assert the specific reason.
          driver_failure=$(nomad alloc status -json "$authfail_alloc_id" | jq -r '[.TaskStates.badauth.Events[]? | select(.Type == "Driver Failure")][0].DisplayMessage // empty')
          echo "driver failure message: ${driver_failure:-none}"

          if [ -z "$driver_failure" ]; then
            echo "::error::expected a Driver Failure event, found none"
            nomad alloc status -verbose "$authfail_alloc_id" || true
            exit 1
          fi
          if echo "$driver_failure" | grep -qi "no login specified"; then
            echo "::error::task failed with 'no login specified' -- the explicit login_username/login_password in this job spec never reached steamcmd, which is a driver bug, not the intended negative-test outcome"
            exit 1
          fi
          if ! echo "$driver_failure" | grep -qi "authentication failed"; then
            echo "::error::expected an authentication-failed message, got: $driver_failure"
            exit 1
          fi
          echo "confirmed genuine steamcmd auth rejection, not a driver bug"

      - name: Render long-running launch-phase job (for recovery test)
        run: |
          # Pairs a real steamcmd install with a trivial long-running
          # "launch" command (standing in for a real game server process),
          # purely to exercise RecoverTask's PID reattach path below.
          #
          # Note: this is a fresh allocation, so install_dir is NOT the
          # same directory the earlier install-only job populated --
          # task-local dirs are per-allocation, not shared across jobs.
          # update_on_start=false therefore does not skip steamcmd here;
          # it's set mainly to exercise that config path, and steamcmd
          # still does a real (small) download. Resources below must
          # cover that install phase, not just the trivial launch command
          # -- StartTask runs both synchronously in the same task cgroup.
          cat > /tmp/launch-test.nomad.hcl <<EOF
          job "steamcmd-e2e-launch" {
            datacenters = ["dc1"]
            type        = "service"

            group "launch" {
              task "sleeper" {
                driver = "steamcmd"

                config {
                  app_id          = "${TEST_APP_ID}"
                  install_dir     = "local/steamapp"
                  update_on_start = false

                  launch {
                    command = "/bin/sleep"
                    args    = ["600"]
                  }
                }

                resources {
                  cpu    = 500
                  memory = 768
                }
              }
            }
          }
          EOF

      - name: Restart-recovery smoke test (RecoverTask)
        run: |
          # -detach: submit and return immediately rather than blocking in
          # the foreground on deployment health. The earlier version of
          # this step ran `nomad job run` in blocking mode, which exits
          # non-zero (killing the script under `set -e`) the moment a
          # deployment fails -- before any of our own diagnostics below
          # ever ran. Polling allocation state ourselves means a failure
          # always gets a full diagnostic dump instead of a bare exit.
          nomad job run -detach /tmp/launch-test.nomad.hcl
          job_id="steamcmd-e2e-launch"

          launch_alloc_id=""
          task_state=""
          for i in $(seq 1 60); do
            launch_alloc_id=$(nomad job allocs -json "$job_id" 2>/dev/null | jq -r '.[0].ID // empty')
            if [ -n "$launch_alloc_id" ]; then
              task_state=$(nomad alloc status -json "$launch_alloc_id" 2>/dev/null | jq -r '.TaskStates.sleeper.State // empty')
              echo "alloc $launch_alloc_id task state: ${task_state:-none yet}"
              if [ "$task_state" = "running" ] || [ "$task_state" = "dead" ]; then
                break
              fi
            fi
            sleep 5
          done

          if [ -z "$launch_alloc_id" ] || [ "$task_state" != "running" ]; then
            echo "::error::launch-phase task never reached running (last state: ${task_state:-unknown})"
            nomad job status "$job_id" || true
            if [ -n "$launch_alloc_id" ]; then
              nomad alloc status -verbose "$launch_alloc_id" || true
              echo "--- stdout/stderr ---"
              nomad alloc logs "$launch_alloc_id" sleeper || true
              nomad alloc logs -stderr "$launch_alloc_id" sleeper || true
            fi
            echo "--- steamcmd task config decode log (all tasks this run) ---"
            grep "steamcmd task config decoded" /tmp/nomad.log || echo "::warning::no task-config decode log lines found"
            exit 1
          fi
          echo "alloc before restart: $launch_alloc_id"

          # Kill and restart the Nomad agent to force RecoverTask.
          sudo pkill -SIGTERM nomad || true
          sleep 2

          sudo -E nohup nomad agent \
            -config=/tmp/nomad-agent.hcl \
            > /tmp/nomad-restart.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4646/v1/status/leader >/dev/null; then
              break
            fi
            sleep 1
          done

          # If RecoverTask correctly reattached by PID instead of losing
          # track of the task, the allocation should still be the same one
          # (Nomad wouldn't need to reschedule/restart it) and the task
          # should still report running.
          post_restart_state=""
          for i in $(seq 1 30); do
            post_restart_state=$(nomad alloc status -json "$launch_alloc_id" 2>/dev/null | jq -r '.TaskStates.sleeper.State // empty')
            echo "post-restart task state: ${post_restart_state:-none yet}"
            if [ "$post_restart_state" = "running" ]; then
              break
            fi
            sleep 3
          done

          if [ "$post_restart_state" != "running" ]; then
            echo "::error::task did not remain running across a client restart -- RecoverTask likely failed to reattach"
            nomad job status "$job_id" || true
            nomad alloc status -verbose "$launch_alloc_id" || true
            echo "--- stdout/stderr ---"
            nomad alloc logs "$launch_alloc_id" sleeper || true
            nomad alloc logs -stderr "$launch_alloc_id" sleeper || true
            cat /tmp/nomad-restart.log || true
            exit 1
          fi
          echo "task still running post-restart with same allocation -- RecoverTask reattach OK"

          nomad job stop -purge "$job_id" || true

      - name: Game server lifecycle (stand-in server, no Steam)
        # Starts, queries, crashes (Nomad must restart it), then stops a
        # stand-in server through the full Nomad -> driver path. See
        # e2e/gameserver-fake.sh.
        run: bash e2e/gameserver-fake.sh

      - name: Real game server starts and answers a query (HLDS, app 90)
        # Real steamcmd install, then the real server binary through the
        # driver, proven by a UDP A2S_INFO reply. See e2e/gameserver-hlds.sh.
        run: bash e2e/gameserver-hlds.sh

      - name: Windows server starts under real Proton (GE-Proton, no Steam)
        # Downloads a pinned GE-Proton (sha512-checked against the release's
        # own checksum file), cross-compiles a tiny Windows server and runs it
        # with platform=windows / runner=proton. See e2e/gameserver-proton.sh.
        run: bash e2e/gameserver-proton.sh

      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/artifacts
          cp /tmp/nomad.log /tmp/artifacts/ 2>/dev/null || true
          cp /tmp/nomad-restart.log /tmp/artifacts/ 2>/dev/null || true
          cp /tmp/task.log /tmp/artifacts/ 2>/dev/null || true
          nomad job status steamcmd-e2e-install > /tmp/artifacts/install-job-status.txt 2>&1 || true
          nomad job status steamcmd-e2e-authfail > /tmp/artifacts/authfail-job-status.txt 2>&1 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: /tmp/artifacts
          retention-days: 7
